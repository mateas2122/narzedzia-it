<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator haseł - Narzędzia IT</title>

    <link href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
    <script src="../js/password.js" defer></script>
</head>

<body class="light">
    <header>
        <nav>
            <a href="../index.html" class="brand">
                <i>build</i>
                <span>Narzędzia IT</span>
            </a>
        </nav>
    </header>

    <main>
        <section class="page active">
            <div class="tool-header">
                <a href="../index.html" class="button back-button">
                    <i>arrow_back</i>
                    <span>Wróć</span>
                </a>

                <h4>Generator haseł</h4>
            </div>

            <article class="tool-panel">
                <div class="field label border">
                    <input id="password-output" type="text" readonly>
                    <label>Wygenerowane hasło</label>
                </div>

                <div class="field label border">
                    <input id="password-length" type="number" min="8" max="64" value="16">
                    <label>Długość hasła</label>
                </div>

                <div class="field label border">
                    <input id="password-strength" type="text" readonly>
                    <label>Siła hasła</label>
                </div>

                <div class="password-options">
                    <label>
                        <input id="lowercase" type="checkbox" checked>
                        <span>Małe litery</span>
                    </label>

                    <label>
                        <input id="uppercase" type="checkbox" checked>
                        <span>Wielkie litery</span>
                    </label>

                    <label>
                        <input id="numbers" type="checkbox" checked>
                        <span>Cyfry</span>
                    </label>

                    <label>
                        <input id="symbols" type="checkbox" checked>
                        <span>Znaki specjalne</span>
                    </label>
                </div>

                <div class="password-actions">
                    <button id="generate-password" class="primary" type="button">
                        <i>refresh</i>
                        <span>Generuj</span>
                    </button>

                    <button id="copy-password" type="button">
                        <i>content_copy</i>
                        <span>Kopiuj</span>
                    </button>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
