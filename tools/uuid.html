<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator UUID - Narzędzia IT</title>

    <link href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
    <script src="../js/uuid.js" defer></script>
</head>

<body class="light">
    <header>
        <nav>
            <a href="../index.html" class="brand">
                <i>build</i>
                <span>Narzędzia IT</span>
            </a>
        </nav>
    </header>

    <main>
        <section class="page active">
            <div class="tool-header">
                <a href="../index.html" class="button back-button">
                    <i>arrow_back</i>
                    <span>Wróć</span>
                </a>

                <h4>Generator UUID</h4>
            </div>

            <article class="tool-panel">
                <div class="field label border">
                    <input id="uuid-output" type="text" readonly>
                    <label>Wygenerowany UUID</label>
                </div>

                <div class="uuid-actions">
                    <button id="generate-uuid" class="primary" type="button">
                        <i>refresh</i>
                        <span>Generuj</span>
                    </button>

                    <button id="copy-uuid" type="button">
                        <i>content_copy</i>
                        <span>Kopiuj</span>
                    </button>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
